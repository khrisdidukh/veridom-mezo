[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "london"          # same target as the MUSD protocol contracts on Mezo
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 2048

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
