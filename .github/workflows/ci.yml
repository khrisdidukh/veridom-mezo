name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts — unit + invariant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test
        working-directory: contracts
        run: forge test --no-match-path "test/fork/*" -vv

  fork:
    name: Contracts — fork tests on Mezo testnet
    runs-on: ubuntu-latest
    continue-on-error: true # depends on the public testnet RPC
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fork tests
        working-directory: contracts
        run: forge test --match-path "test/fork/*" --fork-url https://rpc.test.mezo.org -vv

  web:
    name: Web app — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run build
